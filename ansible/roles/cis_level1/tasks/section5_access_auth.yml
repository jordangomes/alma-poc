---
# Section 5: Access, Authentication, and Authorization

- name: Set permissions on /etc/crontab and cron directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - { path: "/etc/cron.hourly", mode: "0700" }
    - { path: "/etc/cron.daily", mode: "0700" }
    - { path: "/etc/cron.weekly", mode: "0700" }
    - { path: "/etc/cron.monthly", mode: "0700" }
    - { path: "/etc/cron.d", mode: "0700" }
  failed_when: false

- name: Ensure /etc/ssh/sshd_config.d directory exists
  ansible.builtin.file:
    path: "{{ cis_sshd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy SSH daemon CIS hardening configuration
  ansible.builtin.template:
    src: sshd_cis.conf.j2
    dest: "{{ cis_sshd_config_file }}"
    owner: root
    group: root
    mode: '0600'
    validate: 'sshd -t -f %s'
  notify: Restart sshd

- name: Set default inactive password account lockout to 30 days
  ansible.builtin.command:
    cmd: "useradd -D -f {{ cis_inactive_user_lock_days }}"
  changed_when: false

- name: Deploy system umask profile script
  ansible.builtin.template:
    src: umask.sh.j2
    dest: /etc/profile.d/99-cis-umask.sh
    owner: root
    group: root
    mode: '0644'

- name: Configure password quality parameters in /etc/security/pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop:
    - { key: "minlen", value: "14" }
    - { key: "dcredit", value: "-1" }
    - { key: "ucredit", value: "-1" }
    - { key: "lcredit", value: "-1" }
    - { key: "ocredit", value: "-1" }
    - { key: "minclass", value: "4" }
