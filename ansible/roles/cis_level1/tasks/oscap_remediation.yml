---
# Optional OpenSCAP automated remediation task
- name: Run OpenSCAP remediation against SCAP Security Guide
  when: cis_use_oscap_remediation | bool
  block:
    - name: Ensure OpenSCAP scanner and datastreams are present
      ansible.builtin.package:
        name:
          - openscap-scanner
          - scap-security-guide
        state: present

    - name: Determine SCAP Security Guide datastream path
      ansible.builtin.set_fact:
        ssg_ds_path: >-
          {{
            '/usr/share/xml/scap/ssg/content/ssg-almalinux10-ds.xml'
            if query('file', '/usr/share/xml/scap/ssg/content/ssg-almalinux10-ds.xml')
            else '/usr/share/xml/scap/ssg/content/ssg-cs10-ds.xml'
          }}

    - name: Execute OpenSCAP remediation
      ansible.builtin.command:
        cmd: >
          oscap xccdf eval
          --remediate
          --profile xccdf_org.ssgproject.content_profile_cis_workstation_l1
          --results /tmp/oscap-remediation-results.xml
          --report /tmp/oscap-remediation-report.html
          {{ ssg_ds_path }}
      register: oscap_remediate_res
      failed_when: oscap_remediate_res.rc not in [0, 2] # 2 indicates non-compliant rules were remediated
      changed_when: oscap_remediate_res.rc == 2
