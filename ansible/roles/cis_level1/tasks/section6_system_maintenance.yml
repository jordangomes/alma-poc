---
# Section 6: System Maintenance & File Permissions

- name: Set permissions and ownership on critical authentication files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: file
  loop:
    - { path: "/etc/passwd", owner: "root", group: "root", mode: "0644" }
    - { path: "/etc/passwd-", owner: "root", group: "root", mode: "0600" }
    - { path: "/etc/group", owner: "root", group: "root", mode: "0644" }
    - { path: "/etc/group-", owner: "root", group: "root", mode: "0600" }
    - { path: "/etc/shadow", owner: "root", group: "root", mode: "0000" }
    - { path: "/etc/shadow-", owner: "root", group: "root", mode: "0000" }
    - { path: "/etc/gshadow", owner: "root", group: "root", mode: "0000" }
    - { path: "/etc/gshadow-", owner: "root", group: "root", mode: "0000" }
  failed_when: false

- name: Ensure no world-writable files exist in /etc
  ansible.builtin.command:
    cmd: "find /etc -type f -perm -0002 -exec chmod o-w {} +"
  changed_when: false
  failed_when: false
