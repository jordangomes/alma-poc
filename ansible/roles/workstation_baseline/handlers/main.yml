---
# Handlers for cis_level1

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Regenerate auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true
  failed_when: false

- name: Update dconf databases
  ansible.builtin.command:
    cmd: dconf update
  changed_when: true
  failed_when: false
