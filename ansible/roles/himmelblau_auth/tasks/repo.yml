---
# Configure Himmelblau official RPM repository for Enterprise Linux 10

- name: Import Himmelblau repository GPG key
  ansible.builtin.rpm_key:
    key: "{{ himmelblau_repo_gpgkey }}"
    state: present
  when: himmelblau_repo_gpgcheck | bool
  failed_when: false

- name: Deploy Himmelblau yum/dnf repository configuration
  ansible.builtin.yum_repository:
    name: himmelblau
    description: Himmelblau IDM Repository for Enterprise Linux 10
    baseurl: "{{ himmelblau_repo_baseurl }}"
    gpgkey: "{{ himmelblau_repo_gpgkey }}"
    gpgcheck: "{{ himmelblau_repo_gpgcheck }}"
    enabled: "{{ himmelblau_repo_enabled }}"
    repo_gpgcheck: false
    skip_if_unavailable: false
    state: present

