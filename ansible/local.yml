---
# 1. Main orchestration playbook for AlmaLinux 10 local configuration convergence & identity
- name: AlmaLinux 10 Workstation Fleet Orchestration
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - group_vars/all.yml
    - group_vars/himmelblau.yml
    - group_vars/security.yml

  pre_tasks:
    - name: Ensure baseline system packages are installed
      ansible.builtin.package:
        name: "{{ baseline_packages }}"
        state: present

    - name: Ensure chronyd is enabled and running
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true



  roles:
    - role: tpm_fde
      tags: [security, tpm, fde, luks, uefi, escrow]

    - role: bootstrap_pull
      tags: [bootstrap, pull, systemd]

    - role: himmelblau_auth
      tags: [auth, himmelblau, entra, sso]

    - role: workstation_baseline
      tags: [workstation, customization]


  post_tasks:
    - name: Output deployment summary
      ansible.builtin.debug:
        msg:
          - "========================================================"
          - " AlmaLinux 10 Configuration Convergence Completed       "
          - " Profile: {{ system_profile }}                          "
          - " Himmelblau Domain: {{ himmelblau_domain }}             "
          - " SCAP Profile: {{ oscap_profile }}                      "
          - " ansible-pull Timer: Active (every {{ ansible_pull_interval }})"
          - "========================================================"

# 2. Apply OpenSCAP-generated compliance baseline playbook
- name: Apply OpenSCAP Security Baseline
  ansible.builtin.import_playbook: oscap_baseline.yml
  tags: [security, oscap, baseline]


