---
# OpenSCAP Security Baseline & Workstation Hardening Parameters

# OpenSCAP Profile Configuration
oscap_profile: "xccdf_org.ssgproject.content_profile_cis_workstation_l1"
oscap_datastream: "/usr/share/xml/scap/ssg/content/ssg-almalinux10-ds.xml"

# Workstation Baseline Adjustments
workstation_hide_admin_from_gdm: true
workstation_aide_initialize: true
workstation_breakglass_user: "almaadmin"

# TPM 2.0 & Full Disk Encryption (LUKS2) Parameters
tpm_fde_enabled: true
tpm_fde_pcrs: "7"
tpm_fde_crypttab_options: "tpm2-device=auto,discard"
tpm_fde_generate_recovery_key: true
tpm_fde_escrow_backend: "local"
tpm_fde_escrow_local_path: "/root/.luks-recovery-key.txt"


