#version=DEVEL
# AlmaLinux 10 Automated Unattended Kickstart Configuration
# Profile: Workstation (Desktop GNOME) with OpenSCAP CIS Level 1 & ansible-pull

# System Language and Locale
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Installation Mode
graphical
reboot --eject

# Authentication & Security
rootpw --lock
user --name=almaadmin --groups=wheel --plaintext --password=AlmaLinuxPassword123!
selinux --enforcing
firewall --enabled --service=ssh

# Network configuration
network --bootproto=dhcp --device=link --activate --onboot=on

# Installation Source (online repositories for Boot/Netinstall ISO)
url --url="https://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://repo.almalinux.org/almalinux/10/AppStream/x86_64/os/"

# Services
services --enabled="NetworkManager,sshd,chronyd,gdm"


# Partitioning adhering to CIS Benchmark Level 1 recommendations
zerombr
clearpart --all --initlabel
bootloader --location=mbr

# Physical and LVM Partitions (auto-detects install drive)
# biosboot partition required for BIOS mode on GPT disks
part biosboot --fstype="biosboot" --size=1
part /boot/efi --fstype="efi" --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype="xfs" --size=1024
part pv.01 --fstype="lvmpv" --size=1 --grow

volgroup vg_system pv.01
logvol /tmp            --vgname=vg_system --size=2048 --name=lv_tmp    --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/tmp        --vgname=vg_system --size=2048 --name=lv_vartmp --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/log        --vgname=vg_system --size=2048 --name=lv_varlog --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/log/audit  --vgname=vg_system --size=2048 --name=lv_audit  --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var            --vgname=vg_system --size=6144 --name=lv_var    --fstype=xfs --fsoptions="nodev"
logvol /home           --vgname=vg_system --size=4096 --name=lv_home   --fstype=xfs --fsoptions="nodev,nosuid"
logvol /               --vgname=vg_system --size=10240 --grow --name=lv_root --fstype=xfs

# OpenSCAP CIS Hardening Addon during Anaconda installation
%addon org_fedora_oscap
    content-type = scap-security-guide
    profile = xccdf_org.ssgproject.content_profile_cis_workstation_l1
%end

# Package Selection
%packages --ignoremissing
@^workstation-product-environment
@gnome-desktop
git
ansible-core
epel-release
python3
python3-pip
openscap-scanner
scap-security-guide
policycoreutils-python-utils
authselect
curl
tar
sudo
chrony
audit
aide
-telnet
-rsh
-rsh-server
-ypbind
-tftp
-tftp-server
-talk
-talk-server
-xinetd
-gnome-initial-setup
-initial-setup
-initial-setup-gui
%end

# Stage 1: Copy baked Ansible files from ISO media (outside chroot) into target system disk
%post --nochroot --log=/mnt/sysimage/root/ks-post-nochroot.log
echo "Copying baked Ansible playbook from ISO media into target disk..."
mkdir -p /mnt/sysimage/var/lib/ansible/local/ansible
for src_path in /run/install/repo/ansible /run/install/source/ansible /run/install/sources/mount-*/ansible; do
    if [ -d "$src_path" ]; then
        echo "Found baked Ansible at $src_path, copying to target..."
        cp -r "$src_path"/* /mnt/sysimage/var/lib/ansible/local/ansible/
        break
    fi
done
%end

# Stage 2: Post-installation script for ansible-pull orchestration (inside chroot)
%post --log=/root/ks-post.log
set -euo pipefail

# Ensure UTF-8 locale is set for Python and Ansible
export LC_ALL=C.UTF-8
export LANG=C.UTF-8

# Direct output to console/tty1 for real-time visibility during install
exec > >(tee -a /root/ks-post.log >/dev/console 2>/dev/null || cat >> /root/ks-post.log) 2>&1

# Error handling trap
on_error() {
    local exit_code="$1"
    local line_no="$2"
    local last_cmd="$3"
    echo ""
    echo "*******************************************************************************"
    echo " [ERROR] Installation post-configuration failed!"
    echo " Command: '$last_cmd' exited with status $exit_code at line $line_no."
    echo " See detailed log at /root/ks-post.log"
    echo "*******************************************************************************"
    cat <<EOF > /root/INSTALL_FAILED.txt
Installation Post-Configuration Error
====================================
Timestamp: $(date -u)
Exit Code: $exit_code
Line:      $line_no
Command:   $last_cmd

To troubleshoot, inspect:
  - /root/ks-post.log
  - /var/log/messages
  - /tmp/anaconda.log
EOF
}
trap 'on_error $? $LINENO "$BASH_COMMAND"' ERR

echo "================================================================================"
echo " [Post-Install] Starting AlmaLinux 10 Configuration & Hardening Bootstrap"
echo "================================================================================"

GIT_REPO="${GIT_REPO:-https://github.com/jordangomes/alma-poc.git}"
GIT_BRANCH="${GIT_BRANCH:-main}"
LOCAL_ANSIBLE_DIR="/var/lib/ansible/local"

mkdir -p /etc/ansible
mkdir -p "$LOCAL_ANSIBLE_DIR"

# Global ansible.cfg for local pull runs
cat <<'EOF' > /etc/ansible/ansible.cfg
[defaults]
inventory = /var/lib/ansible/local/ansible/inventory/hosts.yml
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
callbacks_enabled = timer, profile_tasks
roles_path = /var/lib/ansible/local/ansible/roles
collections_path = /var/lib/ansible/local/ansible/collections:/usr/share/ansible/collections:~/.ansible/collections
EOF

# Fallback git clone if baked playbook is missing
if [ ! -f "$LOCAL_ANSIBLE_DIR/ansible/local.yml" ]; then
    echo ">> Baked playbook not present. Fetching from Git ($GIT_REPO)..."
    git clone -b "$GIT_BRANCH" "$GIT_REPO" "$LOCAL_ANSIBLE_DIR" || true
else
    echo ">> Found baked Ansible playbook."
fi

# Ensure required Ansible collections are installed (community.general, ansible.posix)
if [ -f "$LOCAL_ANSIBLE_DIR/ansible/requirements.yml" ]; then
    echo ">> Ensuring Ansible collections (community.general, ansible.posix) are installed..."
    ansible-galaxy collection install -r "$LOCAL_ANSIBLE_DIR/ansible/requirements.yml" -p /usr/share/ansible/collections || true
fi

# Deploy systemd continuous convergence units
echo ">> Configuring continuous convergence (ansible-pull.timer)..."
cat <<'EOF' > /etc/systemd/system/ansible-pull.service
[Unit]
Description=Ansible Pull Configuration Convergence
After=network-online.target
Wants=network-online.target

[Service]
Type=oneshot
Environment="LC_ALL=C.UTF-8"
Environment="LANG=C.UTF-8"
WorkingDirectory=/var/lib/ansible/local
ExecStart=/usr/bin/ansible-pull \
    -U https://github.com/jordangomes/alma-poc.git \
    -C main \
    -d /var/lib/ansible/local \
    -i ansible/inventory/hosts.yml \
    ansible/local.yml
StandardOutput=journal+console
StandardError=journal+console
SuccessExitStatus=0 2
Restart=on-failure
RestartSec=30s

[Install]
WantedBy=multi-user.target
EOF

cat <<'EOF' > /etc/systemd/system/ansible-pull.timer
[Unit]
Description=Run Ansible Pull every 30 minutes

[Timer]
OnBootSec=5min
OnUnitActiveSec=30min
RandomizedDelaySec=5min
Persistent=true

[Install]
WantedBy=timers.target
EOF

systemctl daemon-reload
systemctl enable ansible-pull.timer
systemctl set-default graphical.target

# Run initial convergence playbook execution (Ansible will configure GDM, Himmelblau, and Security Baselines)
if [ -f "$LOCAL_ANSIBLE_DIR/ansible/local.yml" ]; then
    echo ">> Executing initial local Ansible playbook configuration..."
    ansible-playbook \
        -i "$LOCAL_ANSIBLE_DIR/ansible/inventory/hosts.yml" \
        "$LOCAL_ANSIBLE_DIR/ansible/local.yml" \
        --connection=local || {
            echo "[WARNING] Initial Ansible run encountered warnings/errors. Review /root/ks-post.log."
        }
else
    echo "[WARNING] $LOCAL_ANSIBLE_DIR/ansible/local.yml not found. Skipping initial playbook execution."
fi

# Configure first-boot MOTD
cat <<'EOF' > /etc/motd
================================================================================
 AlmaLinux 10 Workstation (CIS Hardened & Managed)
 Default Admin: almaadmin (member of wheel)
 Convergence:   systemctl status ansible-pull.timer
 Verification:  sudo bash /usr/local/bin/verify-compliance.sh
================================================================================
EOF

# Install verification script system-wide if present
if [ -f "$LOCAL_ANSIBLE_DIR/scripts/verify-compliance.sh" ]; then
    cp "$LOCAL_ANSIBLE_DIR/scripts/verify-compliance.sh" /usr/local/bin/verify-compliance.sh
    chmod +x /usr/local/bin/verify-compliance.sh
fi

echo "================================================================================"
echo " [Post-Install] AlmaLinux 10 Setup Completed Successfully"
echo "================================================================================"
%end
